
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemedicine-v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telemedicine-v1
  template:
    metadata:
      labels:
        app: telemedicine-v1
    spec:
      containers:
        - name: telemedicine
          image: rishabesh24/telemedicine-devops:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: telemedicine-v1
spec:
  type: NodePort
  selector:
    app: telemedicine-v1
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30081
